name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to a commit, with the release it was in the comment beside it. A tag
# like `@v4` is a name its owner can move to different code at any time; a commit is not.
# Nothing updates these automatically, which is the price: to bump one, take the commit a
# release tag points at — `gh api repos/actions/checkout/commits/v7.0.1 --jq .sha` — and
# change the hash and the comment together.
#
# The runner image is pinned for the same reason. `ubuntu-latest` is a name that moves (to
# Ubuntu 26 from 2026-10-19), and the hook overhead printed below is a number measured on
# one image: a change of image should arrive as a commit that can be read beside the bench
# line, not as a morning when the budget fails on unchanged code.

jobs:
  # The gate that counts. A local hook that scans staged changes only protects commits made
  # where that hook runs; a commit from a cloud session, or from anyone without it, was
  # scanned by nothing, which is how eleven credential-shaped test values reached main
  # before anything objected. This runs for every push and every pull request.
  #
  # The whole history, not the diff: it is small, and "this range is clean" is a weaker
  # statement than "this repository is clean". `.gitleaks.toml` says what is allowed and why.
  #
  # The binary is downloaded at a pinned version and checked against the digest published
  # with that release, rather than using the official action, which needs a paid licence
  # key for an organisation's repositories. Bumping it means changing both values together.
  # `--redact` because this log is public: a scanner that prints what it found has just
  # published it.
  #
  # What the digest below was checked against, on 2026-09-18, since the project publishes
  # no signature and no build attestation to check it against instead: it is the value in
  # the release's checksums file, and separately the sha256 GitHub's own API records for
  # the asset; the asset was uploaded by the maintainer on 2026-03-21 and has not changed
  # since. That is two records of one upload, not two sources. It means the pin protects
  # against the file changing from here on, and says nothing about the day it was built.
  # When bumping, read `digest` and `updated_at` from
  # `gh api repos/gitleaks/gitleaks/releases/tags/v<version>` before trusting the new one.
  secrets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact'

  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # bin/bouncer.cjs is committed so the plugin works without an install step
      # (ADR-002). If this fails, run `npm run build` and commit the result.
      - name: Committed bundle is up to date
        run: |
          if ! git diff --exit-code -- bin/bouncer.cjs; then
            echo "::error::bin/bouncer.cjs is stale. Run 'npm run build' and commit it."
            exit 1
          fi

      # The calibration harness must keep working even though its live run is manual and
      # needs a key. Against the mock the numbers are meaningless; that it completes is not.
      - name: Calibration harness runs
        run: node bin/bouncer.cjs calibrate --backend mock --json > /dev/null
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}

      # Hook overhead is in the latency path of every gated tool call. This step prints it
      # and never fails. It used to be `--budget 150`, and on 2026-09-19 that failed `main`
      # at p95 151.3 ms on unchanged code and passed on a rerun of the same commit (#73): an
      # absolute number measures the runner as much as the hook. The line stays in the log
      # because a slow creep is only visible as a series of these.
      - name: Hook overhead
        run: node scripts/bench.mjs --runs 50

      # The gate. The bundle this change produces against the one it started from, run
      # interleaved so whatever the runner is doing lands in both arms and cancels, failing
      # when the paired median is worse by more than MAX_REGRESSION_PCT of the base's median.
      #
      # The base arm costs no build: bin/bouncer.cjs is committed, and the step above has
      # just proved this checkout's copy equals a fresh build, so the same held for the base
      # when it passed here. For a pull request the checkout is the merge into the base
      # branch, so against `base.sha` the difference is this pull request's and nothing
      # else's; for a push it is the commit the branch was at before.
      #
      # Skipped when the bundle and the bench are both byte-identical to the base, which is
      # every docs-only and test-only change: about 15 s of runner time when it does run,
      # and Actions minutes are a budget. It cannot see a change to policy/default.yaml,
      # because both arms read this checkout's policy; the line above is what shows that.
      #
      # 10, because a byte-identical bundle reads within 1% of itself over 50 pairs and a
      # stray `require("node:crypto")` reads +4.5% on a laptop and more on slower hardware,
      # while the regressions this exists for (unbundling was +93%, ADR-002) are far past
      # it. It is a threshold, so it lives here and not in scripts/.
      - name: Hook overhead against the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          MAX_REGRESSION_PCT: "10"
        run: |
          if ! git fetch --quiet --depth=1 origin "$BASE_SHA"; then
            echo "::notice::Base commit '$BASE_SHA' could not be fetched; nothing to compare against."
            exit 0
          fi
          git show "$BASE_SHA:bin/bouncer.cjs" > "$RUNNER_TEMP/base.cjs"
          if cmp -s "$RUNNER_TEMP/base.cjs" bin/bouncer.cjs \
            && git diff --quiet "$BASE_SHA" -- scripts/bench.mjs; then
            echo "The bundle and the bench are unchanged from $BASE_SHA; nothing to compare."
            exit 0
          fi
          node scripts/bench.mjs --against "$RUNNER_TEMP/base.cjs" --runs 50 \
            --max-regression-pct "$MAX_REGRESSION_PCT"
