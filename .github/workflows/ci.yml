name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to a commit, with the release it was in the comment beside it. A tag
# like `@v4` is a name its owner can move to different code at any time; a commit is not.
# Nothing updates these automatically, which is the price: to bump one, take the commit a
# release tag points at — `gh api repos/actions/checkout/commits/v4.4.0 --jq .sha` — and
# change the hash and the comment together.

jobs:
  # The gate that counts. A local hook that scans staged changes only protects commits made
  # where that hook runs; a commit from a cloud session, or from anyone without it, was
  # scanned by nothing, which is how eleven credential-shaped test values reached main
  # before anything objected. This runs for every push and every pull request.
  #
  # The whole history, not the diff: it is small, and "this range is clean" is a weaker
  # statement than "this repository is clean". `.gitleaks.toml` says what is allowed and why.
  #
  # The binary is downloaded at a pinned version and checked against the digest published
  # with that release, rather than using the official action, which needs a paid licence
  # key for an organisation's repositories. Bumping it means changing both values together.
  # `--redact` because this log is public: a scanner that prints what it found has just
  # published it.
  #
  # What the digest below was checked against, on 2026-09-18, since the project publishes
  # no signature and no build attestation to check it against instead: it is the value in
  # the release's checksums file, and separately the sha256 GitHub's own API records for
  # the asset; the asset was uploaded by the maintainer on 2026-03-21 and has not changed
  # since. That is two records of one upload, not two sources. It means the pin protects
  # against the file changing from here on, and says nothing about the day it was built.
  # When bumping, read `digest` and `updated_at` from
  # `gh api repos/gitleaks/gitleaks/releases/tags/v<version>` before trusting the new one.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact'

  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # bin/bouncer.cjs is committed so the plugin works without an install step
      # (ADR-002). If this fails, run `npm run build` and commit the result.
      - name: Committed bundle is up to date
        run: |
          if ! git diff --exit-code -- bin/bouncer.cjs; then
            echo "::error::bin/bouncer.cjs is stale. Run 'npm run build' and commit it."
            exit 1
          fi

      # The calibration harness must keep working even though its live run is manual and
      # needs a key. Against the mock the numbers are meaningless; that it completes is not.
      - name: Calibration harness runs
        run: node bin/bouncer.cjs calibrate --backend mock --json > /dev/null
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}

      # Hook overhead is in the latency path of every gated tool call. CI machines are
      # noisy, so the budget here is deliberately looser than the 80 ms target we hold
      # ourselves to locally; this catches a dependency blowing up the bundle, not drift.
      # 50 runs rather than 20: p95 over 20 samples rests on a single observation, so a
      # one-off scheduling hiccup on a shared runner reads as a latency regression.
      - name: Latency budget
        run: node scripts/bench.mjs --budget 150 --runs 50
